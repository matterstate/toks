[package]
name = "toks"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Exact tokenizer algorithms with native SIMD kernels"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[features]
avx512 = []
test-api = []
test-allocator = []
test-internals = []
test-degenerate = []
test-guard = []

[workspace]
members = ["python/rust"]
default-members = ["."]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1

[profile.python]
inherits = "release"
panic = "unwind"
